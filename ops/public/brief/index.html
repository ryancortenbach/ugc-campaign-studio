<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your brand brief | Mint Labs</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d0b;--panel:#131713;--line:#273027;--text:#eef3ea;--muted:#9aa894;--mint:#b5e78f;--mint-ink:#14210c;--bad:#ff8a7a}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 80px}
.brand{font-weight:600;letter-spacing:.3px;color:var(--mint)}
h1{font-size:30px;line-height:1.15;margin:14px 0 8px;font-weight:600;letter-spacing:-.5px}
p.lead{color:var(--muted);margin:0 0 28px}
form{display:grid;gap:18px}
label{display:grid;gap:6px;font-size:14px;font-weight:500}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;font:inherit}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:1px;border-color:transparent}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0;display:grid;gap:8px}
legend{font-size:14px;font-weight:500;padding:0 6px}
.choice{display:flex;gap:10px;align-items:center;font-weight:400}
button{background:var(--mint);color:var(--mint-ink);border:0;border-radius:999px;padding:15px 26px;font:600 16px/1 inherit;cursor:pointer;justify-self:start}
button:disabled{opacity:.6;cursor:wait}
.msg{border-radius:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.req{color:var(--mint)}
</style>
</head>
<body>
<main>
  <div class="brand">Mint Labs</div>
  <h1 id="title">Tell us about your brand</h1>
  <p class="lead" id="lead">Loading your order...</p>
  <div id="notice" class="msg" hidden></div>
  <form id="brief" hidden novalidate>
    <label><span>Brand name <span class="req">*</span></span><input type="text" name="brand" maxlength="80" required autocomplete="organization"></label>
    <label><span>Website</span><small>Optional</small><input type="url" name="website" maxlength="200" placeholder="https://"></label>
    <label><span>What should the videos feature? <span class="req">*</span></span><small>The product, collection or service, and what makes it good.</small><textarea name="product" maxlength="800" required></textarea></label>
    <label><span>Who are you trying to reach? <span class="req">*</span></span><small>Age, interests, where they hang out, what they care about.</small><textarea name="audience" maxlength="600" required></textarea></label>
    <label><span>What should viewers do next?</span><small>For example: shop the new drop, use code SPRING, visit the store.</small><input type="text" name="offer" maxlength="300"></label>
    <label><span>Tone and style</span><small>Funny, calm, premium, chaotic, honest review...</small><input type="text" name="tone" maxlength="300"></label>
    <label><span>Anything we must say</span><small>Product names, taglines, facts we can state.</small><textarea name="mustSay" maxlength="400"></textarea></label>
    <label><span>Anything to avoid</span><small>Claims, words, competitors, topics.</small><textarea name="avoid" maxlength="400"></textarea></label>
    <fieldset>
      <legend>On-camera creator</legend>
      <label class="choice"><input type="radio" name="creator" value="different" checked> Different creators across videos</label>
      <label class="choice"><input type="radio" name="creator" value="same"> The same creator in every video</label>
      <label><span>Creator notes</span><small>Optional: who would feel right for your audience.</small><input type="text" name="creatorNotes" maxlength="300"></label>
    </fieldset>
    <fieldset>
      <legend>Video length</legend>
      <label class="choice"><input type="radio" name="length" value="15" checked> About 15 seconds</label>
      <label class="choice"><input type="radio" name="length" value="30"> About 30 seconds</label>
    </fieldset>
    <label><span>Links to photos or assets</span><small>Optional: product photos, logo, brand guide (Google Drive or Dropbox links are fine).</small><textarea name="assets" maxlength="800"></textarea></label>
    <div id="error" class="msg bad" role="alert" hidden></div>
    <button type="submit" id="send">Send brief</button>
  </form>
</main>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const notice = (text, bad) => { const n = $('notice'); n.textContent = text; n.className = 'msg' + (bad ? ' bad' : ''); n.hidden = false; };
async function load() {
  try {
    const res = await fetch('/api/brief?t=' + encodeURIComponent(token));
    const data = await res.json();
    if (!res.ok) { $('lead').textContent = ''; return notice(data.error || 'This link is not valid.', true); }
    if (data.received) { $('title').textContent = 'Thanks, we have your brief'; $('lead').textContent = 'Production is underway. We will email you when your videos are ready.'; return; }
    $('lead').textContent = `Your ${data.package} package: ${data.videos} original videos. This takes about five minutes, and we start as soon as you send it.`;
    $('brief').hidden = false;
  } catch { notice('Could not load your order. Check your connection and refresh.', true); }
}
$('brief').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, data = Object.fromEntries(new FormData(f));
  const missing = ['brand', 'product', 'audience'].filter(k => !String(data[k] || '').trim());
  if (missing.length) { $('error').textContent = 'Please fill in the fields marked with a star.'; $('error').hidden = false; f[missing[0]].focus(); return; }
  if (data.website && !/^https?:\/\//.test(data.website)) { $('error').textContent = 'Website must start with http:// or https://'; $('error').hidden = false; f.website.focus(); return; }
  $('error').hidden = true; $('send').disabled = true; $('send').textContent = 'Sending...';
  try {
    const res = await fetch('/api/brief?t=' + encodeURIComponent(token), {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(data)});
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Could not send your brief.');
    f.hidden = true; $('title').textContent = 'Thanks, we have your brief';
    $('lead').textContent = 'Production starts now. We will email you when your videos are ready to review and download.';
    window.scrollTo(0, 0);
  } catch (err) { $('error').textContent = err.message; $('error').hidden = false; $('send').disabled = false; $('send').textContent = 'Send brief'; }
});
load();
</script>
</body>
</html>
