<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your videos | Mint Labs</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d0b;--panel:#131713;--line:#273027;--text:#eef3ea;--muted:#9aa894;--mint:#b5e78f;--mint-ink:#14210c}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{max-width:1000px;margin:0 auto;padding:40px 16px 80px}
.brand{font-weight:600;color:var(--mint)}
h1{font-size:30px;line-height:1.15;margin:14px 0 8px;font-weight:600;letter-spacing:-.5px}
p.lead{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
video{width:100%;aspect-ratio:9/16;background:#000;display:block}
.meta{padding:12px 14px;display:grid;gap:10px}
.meta b{font-weight:500}
a.dl{display:inline-block;text-align:center;background:var(--mint);color:var(--mint-ink);text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px}
.note{color:var(--muted);font-size:14px;margin-top:28px}
</style>
</head>
<body>
<main>
  <div class="brand">Mint Labs</div>
  <h1 id="title">Your videos</h1>
  <p class="lead" id="lead">Loading...</p>
  <div class="grid" id="grid"></div>
  <p class="note" id="note" hidden>Download links refresh each time you open this page. Your package includes one consolidated revision round: reply to our email with notes on any video.</p>
</main>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
(async () => {
  try {
    const res = await fetch('/api/delivery?t=' + encodeURIComponent(token));
    const data = await res.json();
    const lead = document.getElementById('lead');
    if (!res.ok) { lead.textContent = data.error || 'This link is not valid.'; return; }
    if (data.expired) { lead.textContent = 'These files have expired from our storage. Reply to our email if you need them again.'; return; }
    if (!data.ready) { document.getElementById('title').textContent = 'Your videos are in production'; lead.textContent = 'We will email you as soon as they are ready.'; return; }
    document.getElementById('title').textContent = `${data.brand ? esc(data.brand) + ': ' : ''}your videos are ready`;
    lead.textContent = `${data.videos.length} videos. Watch them here and download the ones you want to keep.`;
    document.getElementById('grid').innerHTML = data.videos.map(v => `<div class="card"><video src="${esc(v.url)}" controls playsinline preload="metadata"></video><div class="meta"><b>${esc(v.title)}</b><a class="dl" href="${esc(v.download)}">Download video ${v.idx}</a></div></div>`).join('');
    document.getElementById('note').hidden = false;
  } catch { document.getElementById('lead').textContent = 'Could not load your videos. Check your connection and refresh.'; }
})();
</script>
</body>
</html>
