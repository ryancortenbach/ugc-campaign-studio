name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mint_ops_ci
          POSTGRES_PASSWORD: test-only-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mint_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and image test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install 'Pillow>=11.3,<12'
      - run: npm run check
      - run: npm run check:durable
      - run: npm test
      - run: npm ci --prefix agent
      - run: npm test --prefix agent
      - run: npm ci --prefix ops --ignore-scripts
      - run: npm run check --prefix ops
      - run: npm run test:offline --prefix ops
      - run: npm run test:sql --prefix ops
      - name: Test reservations on separate PostgreSQL connections
        timeout-minutes: 3
        env:
          OPS_TEST_DATABASE_URL: postgres://postgres:test-only-local@127.0.0.1:5432/mint_ops_ci
        run: npm run test:postgres --prefix ops
